name: 장중 시장 스캔 (09:00·10:30·12:00·14:00 KST)

on:
  schedule:
    # 09:00 KST = 00:00 UTC
    - cron: '0 0 * * 1-5'
    # 10:30 KST = 01:30 UTC
    - cron: '30 1 * * 1-5'
    # 12:00 KST = 03:00 UTC
    - cron: '0 3 * * 1-5'
    # 14:00 KST = 05:00 UTC
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

jobs:
  intraday-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          pip install -r kospi-feature-stock/services/recommender/requirements.txt

      - name: 장중 시장 스캔 실행
        continue-on-error: true
        timeout-minutes: 8
        env:
          POSTGRES_DSN:    ${{ secrets.POSTGRES_DSN }}
          REDIS_URL:       ${{ secrets.REDIS_URL }}
          LGBM_MODEL_DIR:  ${{ github.workspace }}/kospi-feature-stock/services/api/lgbm_export
          SCORE_THRESHOLD: "0.27"
          RISK_THRESHOLD:  "0.55"
          COOLDOWN_DAYS:   "1"
        run: |
          cd kospi-feature-stock
          python scripts/market_scan.py

      - name: ML 추천 생성 (장중 이벤트 처리)
        continue-on-error: true
        timeout-minutes: 10
        env:
          POSTGRES_DSN:         ${{ secrets.POSTGRES_DSN }}
          REDIS_URL:            ${{ secrets.REDIS_URL }}
          LGBM_MODEL_DIR:       ${{ github.workspace }}/kospi-feature-stock/services/api/lgbm_export
          REC_RECOVERY_HOURS:   "3"
          REC_COOLDOWN_MINUTES: "90"
        run: |
          cd kospi-feature-stock
          python services/recommender/entrypoints/daily_rec_worker.py

      - name: 텔레그램 매수신호 알림
        continue-on-error: true
        timeout-minutes: 3
        env:
          POSTGRES_DSN:     ${{ secrets.POSTGRES_DSN }}
          REDIS_URL:        ${{ secrets.REDIS_URL }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd kospi-feature-stock
          python scripts/send_telegram_alerts.py
