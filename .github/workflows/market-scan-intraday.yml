name: 장중 시장 스캔 (GCP quant-scanner 이전됨 — 백업 수동 실행만)
# ⚠️ 2026-08-07: quant-scanner intraday-scan.timer (5분마다)로 이전
#    스케줄 비활성화 — workflow_dispatch 수동 실행만 유지 (긴급 시 사용)
#    월 절감: ~2,000분/월 → 0

on:
  workflow_dispatch:

jobs:
  intraday-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          pip install -r kospi-feature-stock/services/recommender/requirements.txt

      - name: 장중 시장 스캔 실행
        continue-on-error: true
        timeout-minutes: 8
        env:
          POSTGRES_DSN:    ${{ secrets.POSTGRES_DSN }}
          REDIS_URL:       ${{ secrets.REDIS_URL }}
          LGBM_MODEL_DIR:  ${{ github.workspace }}/kospi-feature-stock/services/api/lgbm_export
          SCORE_THRESHOLD: "0.27"
          RISK_THRESHOLD:  "0.55"
          COOLDOWN_DAYS:   "1"
        run: |
          cd kospi-feature-stock
          python scripts/market_scan.py

      - name: ML 추천 생성 (장중 이벤트 처리)
        continue-on-error: true
        timeout-minutes: 10
        env:
          POSTGRES_DSN:         ${{ secrets.POSTGRES_DSN }}
          REDIS_URL:            ${{ secrets.REDIS_URL }}
          LGBM_MODEL_DIR:       ${{ github.workspace }}/kospi-feature-stock/services/api/lgbm_export
          REC_RECOVERY_HOURS:   "3"
          REC_COOLDOWN_MINUTES: "90"
        run: |
          cd kospi-feature-stock
          python services/recommender/entrypoints/daily_rec_worker.py

      - name: 텔레그램 매수신호 알림
        continue-on-error: true
        timeout-minutes: 3
        env:
          POSTGRES_DSN:     ${{ secrets.POSTGRES_DSN }}
          REDIS_URL:        ${{ secrets.REDIS_URL }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd kospi-feature-stock
          python scripts/send_telegram_alerts.py
