name: GCP VM 헬스체크 + 자동 재시작

on:
  schedule:
    # 매 30분마다 (평일·주말 무관)
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: GCP 인증
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: gcloud CLI 설정
        uses: google-github-actions/setup-gcloud@v2

      - name: VM 상태 확인 및 재시작
        env:
          GCP_PROJECT:  ${{ secrets.GCP_PROJECT_ID }}
          GCP_ZONE:     ${{ secrets.GCP_ZONE }}
          GCP_INSTANCE: ${{ secrets.GCP_INSTANCE }}
        run: |
          STATUS=$(gcloud compute instances describe "$GCP_INSTANCE" \
            --project="$GCP_PROJECT" \
            --zone="$GCP_ZONE" \
            --format="value(status)")

          echo "VM 상태: $STATUS"

          if [ "$STATUS" = "TERMINATED" ] || [ "$STATUS" = "STOPPED" ]; then
            echo "VM이 중지됨 — 시작 중..."
            gcloud compute instances start "$GCP_INSTANCE" \
              --project="$GCP_PROJECT" \
              --zone="$GCP_ZONE"
            echo "VM 시작 명령 전송 완료"
          elif [ "$STATUS" = "RUNNING" ]; then
            echo "VM 정상 실행 중"
          else
            echo "알 수 없는 상태: $STATUS"
          fi

      - name: systemd 서비스 확인 및 재기동 (SSH)
        if: always()
        env:
          GCP_PROJECT:  ${{ secrets.GCP_PROJECT_ID }}
          GCP_ZONE:     ${{ secrets.GCP_ZONE }}
          GCP_INSTANCE: ${{ secrets.GCP_INSTANCE }}
          GCP_USER:     ${{ secrets.GCP_SSH_USER }}
        run: |
          # VM이 RUNNING 상태가 될 때까지 최대 60초 대기
          for i in $(seq 1 12); do
            STATUS=$(gcloud compute instances describe "$GCP_INSTANCE" \
              --project="$GCP_PROJECT" --zone="$GCP_ZONE" \
              --format="value(status)")
            [ "$STATUS" = "RUNNING" ] && break
            echo "VM 기동 대기... ($i/12)"
            sleep 5
          done

          # IAP 터널을 통한 SSH: ws-detector/ws-notifier 서비스 상태 점검 + 자동 재시작
          gcloud compute ssh "${GCP_USER}@${GCP_INSTANCE}" \
            --project="$GCP_PROJECT" \
            --zone="$GCP_ZONE" \
            --tunnel-through-iap \
            --command='
              for svc in ws-detector ws-notifier; do
                if ! systemctl is-active --quiet "$svc"; then
                  echo "$svc 비활성 — 재시작"
                  sudo systemctl start "$svc"
                else
                  echo "$svc 정상"
                fi
              done
            ' || echo "SSH 점검 실패 (IAP 권한 또는 서비스 계정 설정 확인 필요)"
