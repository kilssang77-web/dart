name: GCP VM 헬스체크 + 서비스 자동 복구

on:
  schedule:
    # 매 30분마다 (평일·주말 무관)
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: API 헬스체크 + systemd 서비스 복구 (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key:      ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          timeout:  30s
          script: |
            echo "=== $(date '+%Y-%m-%d %H:%M:%S KST') 헬스체크 시작 ==="

            # 1. Docker API 컨테이너 상태 확인
            if docker ps --filter "name=quant-eye-api" --filter "status=running" | grep -q quant-eye-api; then
              echo "[API] quant-eye-api 컨테이너 정상"
            else
              echo "[API] quant-eye-api 컨테이너 비정상 — 재시작 시도"
              docker start quant-eye-api || true
            fi

            # 2. systemd 서비스 상태 확인 및 복구
            for svc in ws-detector ws-notifier; do
              if systemctl is-active --quiet "$svc"; then
                echo "[systemd] $svc 정상"
              else
                echo "[systemd] $svc 비활성 — 재시작"
                sudo systemctl start "$svc" || true
              fi
            done

            # 3. rec-worker.timer 상태 (있으면 확인)
            if systemctl list-timers rec-worker.timer --no-pager 2>/dev/null | grep -q rec-worker; then
              echo "[timer] rec-worker.timer 등록됨"
            fi

            echo "=== 헬스체크 완료 ==="
