name: GCP VM 헬스체크 + 서비스 자동 복구

on:
  schedule:
    # 평일 장 시간(08:30~16:30 KST) 1시간마다 — 월 ~160회 (기존 30분: 1,440회)
    - cron: '0 23 * * 0-4'  # 08:00 KST
    - cron: '0 0 * * 1-5'   # 09:00 KST
    - cron: '0 1 * * 1-5'   # 10:00 KST
    - cron: '0 2 * * 1-5'   # 11:00 KST
    - cron: '0 3 * * 1-5'   # 12:00 KST
    - cron: '0 4 * * 1-5'   # 13:00 KST
    - cron: '0 5 * * 1-5'   # 14:00 KST
    - cron: '0 6 * * 1-5'   # 15:00 KST
    - cron: '0 7 * * 1-5'   # 16:00 KST
  workflow_dispatch:

jobs:
  # ── quant-eye-server: API Docker 컨테이너 복구 ──────────────
  check-api-server:
    name: quant-eye-server — API Docker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API 컨테이너 확인 및 복구
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key:      ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          timeout:  30s
          script: |
            echo "=== $(date '+%Y-%m-%d %H:%M:%S') [quant-eye-server] ==="
            if docker ps --filter "name=quant-eye-api" --filter "status=running" | grep -q quant-eye-api; then
              echo "[API] quant-eye-api 컨테이너 정상"
            else
              echo "[API] quant-eye-api 비정상 — 재시작"
              docker start quant-eye-api || true
            fi

  # ── quant-scanner: ws-detector/ws-notifier systemd 복구 ─────
  check-scanner:
    name: quant-scanner — systemd 서비스
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: systemd 서비스 확인 및 복구
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.GCP_SCANNER_HOST }}
          username: ${{ secrets.GCP_SCANNER_USER }}
          key:      ${{ secrets.GCP_SCANNER_SSH_KEY }}
          timeout:  30s
          script: |
            echo "=== $(date '+%Y-%m-%d %H:%M:%S') [quant-scanner] ==="
            for svc in ws-detector ws-notifier; do
              if systemctl is-active --quiet "$svc"; then
                echo "[systemd] $svc 정상"
              else
                echo "[systemd] $svc 비활성 — 재시작"
                sudo systemctl start "$svc" || true
              fi
            done
            if systemctl list-timers rec-worker.timer --no-pager 2>/dev/null | grep -q rec-worker; then
              echo "[timer] rec-worker.timer 등록됨"
            fi
