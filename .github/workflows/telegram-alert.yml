name: 매수 추천 Telegram 알림 (Supabase 폴링)

on:
  schedule:
    # 평일 장중 30분 간격: KST 09:00~15:30 = UTC 00:00~06:30
    - cron: '0,30 0,1,2,3,4,5,6 * * 1-5'
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: kospi-feature-stock/requirements-cloud.txt

      - name: 의존성 설치
        run: pip install asyncpg

      - name: Telegram 알림 전송
        env:
          SUPABASE_DSN:      ${{ secrets.SUPABASE_DSN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kospi-feature-stock/scripts/send_telegram_alerts.py
