name: ML 자동 재학습 (매주 일요일)

on:
  schedule:
    # 매주 일요일 09:00 KST = 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force_retrain:
        description: '강제 재학습 (AUC 검증 무시)'
        required: false
        default: 'false'

jobs:
  ml-retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 현재 모델 커밋 해시 저장 (롤백용)
        id: save_model_ref
        run: |
          SHA=$(git log -1 --format=%H -- kospi-feature-stock/services/api/lgbm_export/ 2>/dev/null || echo "")
          echo "model_sha=$SHA" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: kospi-feature-stock/services/ml/requirements.txt

      - name: ML 의존성 설치
        run: |
          pip install lightgbm xgboost scikit-learn pandas numpy asyncpg \
                      imbalanced-learn optuna shap joblib orjson \
                      python-dotenv

      - name: 실전 승률 DB 조회 + 학습 파라미터 결정
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
        run: |
          python3 - <<'PY'
          import asyncio, json, os, sys
          from pathlib import Path

          env_file = os.environ.get("GITHUB_ENV", "/dev/null")

          async def fetch_win_rate():
              dsn = os.environ.get("POSTGRES_DSN", "").replace("+asyncpg", "")
              if not dsn:
                  return None, 0, 0.0
              try:
                  import asyncpg
                  ssl = "require" if "supabase" in dsn else False
                  conn = await asyncpg.connect(dsn, statement_cache_size=0, ssl=ssl)
                  try:
                      row = await conn.fetchrow("""
                          SELECT
                              COUNT(*)                                          AS total,
                              SUM(CASE WHEN rp.is_success THEN 1 ELSE 0 END)  AS wins,
                              AVG(rp.r_5d)                                     AS avg_r5d
                          FROM recommendation_performance rp
                          JOIN recommendations r ON r.id = rp.rec_id
                          WHERE rp.tracking_complete = TRUE
                            AND r.created_at >= NOW() - INTERVAL '30 days'
                      """)
                      total  = int(row["total"] or 0)
                      wins   = int(row["wins"]  or 0)
                      avg_r5 = float(row["avg_r5d"] or 0.0)
                      wr = wins / total if total > 0 else None
                      return wr, total, avg_r5
                  finally:
                      await conn.close()
              except Exception as e:
                  print(f"DB 조회 실패: {e}")
                  return None, 0, 0.0

          wr, total, avg_r5 = asyncio.run(fetch_win_rate())

          # DB에서 못 가져오면 git 내 model_metrics.json fallback
          if wr is None:
              p = Path("kospi-feature-stock/services/api/lgbm_export/model_metrics.json")
              if p.exists():
                  try:
                      m = json.loads(p.read_text())
                      wr    = float(m.get("win_rate_30d", 0.45)) if m.get("win_total_30d", 0) >= 10 else None
                      total = int(m.get("win_total_30d", 0))
                      avg_r5 = float(m.get("avg_return_30d", 0.0))
                      print(f"[fallback] model_metrics.json 사용: win_rate={wr}  total={total}")
                  except Exception:
                      pass

          if wr is not None and total >= 10:
              print(f"실전 승률(30일): {wr:.1%}  (샘플 {total}건  평균5일수익 {avg_r5:+.2f}%)")
              if wr >= 0.60:
                  entry_pct, risk_pct = 12.0, 6.0
                  reason = f"고승률({wr:.0%}) -> 공격적"
              elif wr <= 0.35:
                  entry_pct, risk_pct = 8.0, 4.0
                  reason = f"저승률({wr:.0%}) -> 보수적"
              else:
                  entry_pct, risk_pct = 10.0, 5.0
                  reason = f"정상승률({wr:.0%}) -> 기본"
              print(f"-> entry_pct={entry_pct}%  risk_pct={risk_pct}%  ({reason})")
          else:
              entry_pct, risk_pct = 10.0, 5.0
              wr_str = f"{wr:.4f}" if wr else "N/A"
              print(f"샘플 부족({total}건 < 10) 또는 데이터 없음 -> 기본값 (win_rate={wr_str})")

          wr_str = f"{wr:.4f}" if wr is not None else "N/A"
          with open(env_file, "a") as f:
              f.write(f"ML_ENTRY_PCT={entry_pct}\n")
              f.write(f"ML_RISK_PCT={risk_pct}\n")
              f.write(f"REAL_WIN_RATE={wr_str}\n")
              f.write(f"REAL_WIN_TOTAL={total}\n")
          PY

      - name: ML 재학습 실행
        env:
          POSTGRES_DSN:           ${{ secrets.POSTGRES_DSN }}
          LGBM_MODEL_DIR:         kospi-feature-stock/services/api/lgbm_export
          ML_MIN_AUC_THRESHOLD:   "0.54"
          DISCORD_WEBHOOK:        ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          ENTRY="${ML_ENTRY_PCT:-6.0}"
          RISK="${ML_RISK_PCT:-4.0}"
          echo "학습 파라미터: entry_pct=${ENTRY}%  risk_pct=${RISK}%"
          mkdir -p kospi-feature-stock/services/api/lgbm_export
          cd kospi-feature-stock
          # 학습 범위: 3년(2022~2024) / max_codes: 200 / trials: 15
          # → GitHub Actions 120분 내 완료 가능 (실측 40~70분)
          # label=market_alpha: KOSPI 대비 초과수익 여부 (target_hit보다 달성 쉬움)
          python services/ml/walk_forward_train.py \
            --train-start 2022-01-01 --train-end 2024-09-30 \
            --val-start   2024-10-01 --val-end   2025-06-30 \
            --test-start  2025-07-01 --test-end  2026-12-31 \
            --label-mode market_alpha \
            --entry-pct "${ENTRY}" \
            --risk-pct  "${RISK}"  \
            --smote \
            --max-codes 200 \
            --model-dir services/api/lgbm_export \
            --optuna-trials 15 \
            --event-only

      - name: 새 모델 git commit → Docker 이미지 자동 갱신 트리거
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kospi-feature-stock/services/api/lgbm_export/
          if git diff --cached --quiet; then
            echo "모델 파일 변경 없음 — commit 생략"
          else
            git commit -m "chore(ml): 자동 재학습 모델 갱신 $(date +'%Y-%m-%d')"
            git push origin HEAD
            echo "모델 commit 완료 → deploy-api.yml 자동 트리거"
          fi

      - name: 재학습 실패 시 이전 모델 복구
        if: failure() && steps.save_model_ref.outputs.model_sha != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout ${{ steps.save_model_ref.outputs.model_sha }} -- kospi-feature-stock/services/api/lgbm_export/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "hotfix(ml): 재학습 실패 — $(date +'%Y-%m-%d') 이전 모델로 복구"
            git push origin HEAD
            echo "이전 모델 복구 완료"
          else
            echo "복구할 모델 변경 없음 (첫 학습 실패 또는 동일 모델)"
          fi

      - name: 재학습 완료 Discord 알림
        if: always()
        run: |
          [ -z "${{ secrets.DISCORD_WEBHOOK }}" ] && exit 0
          STATUS="${{ job.status }}"
          WIN="${REAL_WIN_RATE:-N/A}"
          TOTAL="${REAL_WIN_TOTAL:-0}"
          if [ "$STATUS" = "success" ]; then
            MSG="✅ **ML 재학습 완료** — 새 모델이 Docker 이미지에 반영됩니다.\n📊 실전 승률(30일): ${WIN} (${TOTAL}건)"
          else
            MSG="❌ **ML 재학습 실패** — 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n📊 실전 승률(30일): ${WIN} (${TOTAL}건)"
          fi
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"$MSG\"}" || true
