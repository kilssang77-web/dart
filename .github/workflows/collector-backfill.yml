name: 일봉 과거 데이터 백필 (ML 학습용, 수동 실행)

on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '백필 기간 (일수). 기본 2922 = 8년'
        required: false
        default: '2922'
      max_codes:
        description: '대상 종목 수 상한 (거래대금 상위 N개)'
        required: false
        default: '700'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # ~5.5시간 (GitHub Actions 6시간 한도 이내)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: kospi-feature-stock/services/collector/requirements.txt

      - name: 의존성 설치
        run: pip install -r kospi-feature-stock/services/collector/requirements.txt

      - name: 과거 일봉 백필 실행 (1회 배치)
        timeout-minutes: 320
        env:
          POSTGRES_DSN:        ${{ secrets.POSTGRES_DSN }}
          REDIS_URL:           ${{ secrets.REDIS_URL }}
          KIS_APP_KEY:         ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:      ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO:      ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_BASE_URL:        ${{ secrets.KIS_BASE_URL }}
          BARS_BACKFILL_ONCE:  "1"
          BARS_BACKFILL_DAYS:  ${{ github.event.inputs.backfill_days || '2922' }}
          BARS_MAX_CODES:      ${{ github.event.inputs.max_codes || '700' }}
        run: |
          cd kospi-feature-stock
          python services/collector/entrypoints/backfill_bars_worker.py

      - name: 완료 Discord 알림
        if: always()
        run: |
          [ -z "${{ secrets.DISCORD_WEBHOOK }}" ] && exit 0
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            MSG="✅ **일봉 백필 완료** — ML 재학습 워크플로를 실행하세요."
          else
            MSG="❌ **일봉 백필 실패** — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"$MSG\"}" || true
