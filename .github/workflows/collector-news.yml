name: 공시·뉴스 수집 (하루 2회)

on:
  schedule:
    # KST 09:05 / 13:00 = UTC 00:05 / 04:00, 평일 (장 중 오전·오후 각 1회)
    - cron: '5 0 * * 1-5'
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: kospi-feature-stock/services/collector/requirements.txt

      - name: 의존성 설치
        run: |
          pip install -r kospi-feature-stock/services/collector/requirements.txt

      - name: 공시·뉴스 수집 실행 (최대 8분)
        env:
          POSTGRES_DSN:      ${{ secrets.POSTGRES_DSN }}
          REDIS_URL:         ${{ secrets.REDIS_URL }}
          DART_API_KEY:      ${{ secrets.DART_API_KEY }}
          KIS_APP_KEY:       ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:    ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO:    ${{ secrets.KIS_ACCOUNT_NO }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_INTERVAL_SEC: "0"
        run: |
          cd kospi-feature-stock
          timeout 480 python services/collector/entrypoints/news_worker.py || true

      - name: 공시 키워드 Telegram 알림 (is_flagged 신규 공시)
        continue-on-error: true
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          REDIS_URL:    ${{ secrets.REDIS_URL }}
        run: |
          pip install -q asyncpg python-dotenv redis
          python kospi-feature-stock/scripts/disclosure_alert.py

      - name: 실패 시 Discord 알림
        if: failure()
        run: |
          [ -z "${{ secrets.DISCORD_WEBHOOK }}" ] && exit 0
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"content": "⚠️ **공시 수집 실패** (${{ github.run_id }})"}' || true
