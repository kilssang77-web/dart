name: 로컬 DB → Supabase 증분 동기화

on:
  schedule:
    - cron: '0 17 * * 1-5'   # 평일 02:00 KST (UTC 17:00 전일)
  workflow_dispatch:
    inputs:
      days:
        description: '동기화 기간 (일수, 기본 90)'
        required: false
        default: '90'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: kospi-feature-stock/services/collector/requirements.txt

      - name: 의존성 설치
        run: pip install asyncpg python-dotenv

      - name: 증분 동기화 실행
        env:
          SRC_POSTGRES_DSN:  ${{ secrets.POSTGRES_DSN }}
          DST_POSTGRES_DSN:  ${{ secrets.POSTGRES_DSN }}
          SYNC_DAYS:         ${{ github.event.inputs.days || '90' }}
        run: python kospi-feature-stock/scripts/sync_to_supabase.py

      - name: 완료 알림
        if: always()
        run: |
          [ -z "${{ secrets.DISCORD_WEBHOOK }}" ] && exit 0
          STATUS="${{ job.status }}"
          MSG="$([ "$STATUS" = "success" ] && echo "✅ Supabase 동기화 완료" || echo "❌ Supabase 동기화 실패 — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")"
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"$MSG\"}" || true
